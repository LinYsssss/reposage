# RepoSage single-host demo stack.
#
# SECURITY NOTE: this Compose file is for CONTROLLED DEMONSTRATIONS, not hostile multi-tenant
# execution. The sandbox-runner reaches Docker only through a restricted socket proxy (never the raw
# host socket), and analysis containers it launches get `--network none` and no Docker access. That
# contains accidental and demo-level misuse, but a single shared host is not a substitute for
# per-tenant VM/Kata isolation under a real adversary.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: code_review
      POSTGRES_USER: code_review
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-code_review}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build:
      context: ../backend
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
      - model-service
    ports:
      - "8080:8080"
    volumes:
      - ../demo-repos:/app/demo-repos:ro
      - backend_work:/app/.work

  model-service:
    build:
      context: ../model-service
    environment:
      MODEL_PATH: /app/models/risk_classifier.joblib
      MODEL_VERSION: docker-demo-v1
    ports:
      - "8000:8000"

  # Restricted Docker API: forwards only the operations the runner needs and denies the rest.
  # Mounts the host socket itself; the runner only ever sees this filtered TCP endpoint.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      POST: 1
      # Explicitly denied (default is deny for anything not set to 1).
      EXEC: 0
      NETWORKS: 0
      VOLUMES: 0
      SWARM: 0
      SECRETS: 0
      CONFIGS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No published ports: reachable only by other services on the Compose network.

  # Trusted runner: consumes signed jobs and launches constrained ephemeral analysis containers.
  # No published ports (no inbound HTTP). Docker access is via the proxy only.
  sandbox-runner:
    build:
      context: ../sandbox-runner
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-code_review}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me}
      SANDBOX_SIGNING_SECRET: ${SANDBOX_SIGNING_SECRET:-change-me-sandbox}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SANDBOX_CACHE_ROOT: /cache
    volumes:
      # Dependency caches: populated by allowlisted preparation jobs, mounted read-only into
      # untrusted test containers (which always run with --network none).
      - sandbox_dep_cache:/cache
    depends_on:
      - rabbitmq
      - docker-socket-proxy

  frontend:
    build:
      context: ../frontend
      args:
        VITE_DEMO_REPO_PATH: ${VITE_DEMO_REPO_PATH:-/app/demo-repos/mall-order-service}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_work:
  sandbox_dep_cache:
